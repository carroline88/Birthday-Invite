<!DOCTYPE html>
<html lang="sv">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Birthday Invite</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />

    <link rel="stylesheet" href="styles/style.css">
</head>

<body>

    <main class="invite-card">

        <h1 class="animate__animated animate__pulse">You are invited 🎂</h1>

        <p class="subtitle">Welcome to my birthday celebration</p>


        <div class="floating-balloon">🎈</div>

        <div class="event-details">
            <p>📅 Saturday 26 September</p>
            <p>⏰ Kl. 18:00</p>
            <p>📍 Party venue</p>
        </div>


        <button class="rsvp-btn">Reply here</button>
    </main>

</body>

</html>
